name: CI

# Every commit is tested once.
#
# A branch of this repository is tested when it is pushed. A pull request is
# tested as a pull request only when its branch lies in another repository (a
# fork), because a push there starts nothing here.
#
# Why not both: a push to a branch with an open pull request used to start
# every job twice, once for the push and once for the pull request. The two
# runs together asked for twelve macOS runners, and an account is given five
# at a time (https://docs.github.com/en/actions/reference/limits). Twice a
# macOS job of one of the two runs was never given a runner, and the run ended
# red without having run a single step.
#
# What a single run does not test: the merge of a branch of this repository
# with its base branch before the merge is made. The base branch is tested
# when the merge is pushed to it.
on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/tests.yml
