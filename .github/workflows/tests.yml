# The jobs of CI. This file is started by ci.yml, which decides when they run.
name: Tests

on:
  workflow_call:

permissions:
  contents: read

# Every step runs in bash, including on Windows (Git Bash ships with the runner),
# so the same command lines work on all three operating systems.
defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Make UTF-8 the default text encoding everywhere. It already is on Linux and
  # macOS; on Windows this replaces the legacy code page.
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # No torch here: pyproject.toml tells mypy to treat the ML stack as untyped,
      # so the type check gives the same answer with or without it installed.
      # Ruff is pinned (to the version in .pre-commit-config.yaml) because a new
      # formatter release can change style and fail this job with no code change.
      - name: Install
        run: python -m pip install -e ".[test]" "ruff==0.17.4" mypy
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy

  core:
    # The core install depends on pycryptodome alone. This job checks that it
    # works by itself on Linux, macOS and Windows; tests marked "ml" skip.
    name: Core (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (core and test tools only)
        run: python -m pip install -e ".[test]"
      - name: Check that the ML stack is absent
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          ml_stack = ("torch", "transformers", "peft", "safetensors")
          found = [name for name in ml_stack if importlib.util.find_spec(name)]
          if found:
              sys.exit("this job must run without the ML stack, found: " + ", ".join(found))
          PY
      - name: Test
        run: pytest

  gate:
    # The document gate with its MCP server and PDF extraction. The MCP SDK needs
    # Python 3.11 or newer; the core job above runs the gate's other tests on 3.10.
    name: Gate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (gate extras and test tools)
        run: python -m pip install -e ".[gate,test]"
      - name: Test the gate
        run: pytest tests/test_gate_*.py tests/test_api.py tests/test_docs.py

  browser:
    # The app's interface, walked in a real browser against the real app: on
    # Linux in Chromium and on macOS in WebKit, the engine of Safari. The two
    # walk-throughs are plain Node scripts (tests/browser/); they record no
    # traces and leave screenshots, which are kept whether or not a step failed.
    # The package is installed the way a user installs it, not in editable mode,
    # so the interface that is walked is the one inside the built package.
    name: Browser (${{ matrix.os }}, ${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
            playwright-install: --with-deps chromium
          - os: macos-latest
            browser: webkit
            playwright-install: webkit
    env:
      GATE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install (gate extras)
        run: python -m pip install '.[gate]'
      # Playwright is pinned: each release drives one build of each engine.
      - name: Install Playwright
        run: npm install --no-save playwright@1.63.0
      - name: Install the browser
        run: npx playwright install ${{ matrix.playwright-install }}
      - name: Walk through the demo
        id: demo
        env:
          GATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node tests/browser/journey_demo.js
      - name: Walk through a new vault
        # Also when the demo failed, so that one run shows everything that fails;
        # not when the installation failed and the demo did not run at all.
        if: ${{ !cancelled() && steps.demo.outcome != 'skipped' }}
        env:
          GATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node tests/browser/journey_real.js
      - name: Upload the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.os }}-${{ matrix.browser }}
          path: tests/browser/shots/
          if-no-files-found: warn

  ml:
    name: ML (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      # The tests build their own tiny models and need nothing from the Hugging
      # Face Hub. Offline mode turns an accidental download into a test failure.
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install PyTorch (CPU build)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install (all extras)
        run: python -m pip install -e ".[ml,langchain,pdf,test]"
      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  ml-macos:
    # The full suite on Apple Silicon. PyPI's macOS arm64 wheel of PyTorch is the
    # right build already, so there is no separate PyTorch step. If the runner
    # exposes the Metal (MPS) device, the MPS test trains and applies an adapter
    # on it; otherwise that test reports itself as skipped (see the -rs summary).
    name: ML (macOS, Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (all extras)
        run: python -m pip install -e ".[ml,langchain,pdf,test]"
      - name: Report the accelerator
        run: python -c "import platform, torch; print(platform.machine(), 'torch', torch.__version__, 'mps built:', torch.backends.mps.is_built(), 'mps available:', torch.backends.mps.is_available())"
      - name: Test
        run: pytest -rs

  ml-minimum:
    # Keeps the version floors in pyproject.toml honest: the full suite must pass
    # on the oldest releases of each dependency that the package claims to support.
    name: ML (minimum supported versions)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install PyTorch (CPU build, minimum version)
        run: python -m pip install "torch==2.2.2" --index-url https://download.pytorch.org/whl/cpu
      - name: Install the minimum versions of everything else
        # torch 2.2 predates NumPy 2, hence the NumPy pin.
        run: >
          python -m pip install
          "numpy<2"
          "pycryptodome==3.19.0"
          "transformers==4.56.0"
          "peft==0.15.0"
          "safetensors==0.4.3"
          "pypdf==7.0.1"
          "langchain-core==0.3.0"
      - name: Install the package (keeps the pins above, which satisfy its floors)
        run: python -m pip install -e ".[ml,langchain,pdf,test]"
      - name: Show resolved versions
        run: python -m pip list
      - name: Test
        run: pytest

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Check that every link in the PyPI description is absolute
        # The README uses relative links; the build rewrites them (see pyproject.toml).
        run: |
          python - <<'EOF'
          import glob, re, zipfile

          with zipfile.ZipFile(glob.glob("dist/*.whl")[0]) as wheel:
              name = next(n for n in wheel.namelist() if n.endswith(".dist-info/METADATA"))
              description = wheel.read(name).decode("utf-8")
          links = re.findall(r"\]\(([^)\s]+)\)", description)
          relative = [link for link in links if not re.match(r"https?://|mailto:|#", link)]
          assert len(links) > 10, "the description should contain the README"
          assert not relative, f"these links would be broken on PyPI: {relative}"
          print(f"{len(links)} links, all absolute")
          EOF
      - name: Install the wheel into a fresh virtual environment (core only)
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
      - name: Smoke-test the installed wheel
        # Run from outside the checkout so that only the installed wheel is importable.
        working-directory: ${{ runner.temp }}
        run: |
          source wheel-venv/bin/activate
          wdva --version
          python -c "import wdva; print(wdva.__version__)"
          python -c "from importlib.resources import files; assert files('wdva').joinpath('py.typed').is_file(), 'py.typed is missing from the wheel'"
          wdva keygen -o k.key
          python -c "import wdva; k = wdva.SecretKey.from_file('k.key'); wdva.seal_to_file('t.wdva', b'round trip', key=k); assert wdva.unseal_file('t.wdva', key=k).payload == b'round trip'; print('round trip ok')"
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
