[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "wdva"
dynamic = ["version", "readme"]
description = "Encrypted vaults for LoRA/DoRA adapters: fine-tune locally, seal with XChaCha20-Poly1305, load straight from ciphertext into memory."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Enclave Team" }]
keywords = [
    "lora",
    "dora",
    "peft",
    "adapters",
    "encryption",
    "privacy",
    "local-llm",
    "fine-tuning",
    "xchacha20-poly1305",
    "mcp",
    "agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
# The core install can seal, unseal, inspect and re-key vaults. It needs no ML stack.
dependencies = ["pycryptodome>=3.19"]

[project.optional-dependencies]
# Training and inference.
ml = [
    "torch>=2.2",
    "transformers>=4.56",
    "peft>=0.15",
    "safetensors>=0.4.3",
]
# PDF text extraction for `wdva train some.pdf`.
pdf = ["pypdf>=7.0.1"]
# LangChain chat model.
langchain = ["wdva[ml]", "langchain-core>=0.3"]
# The MCP server that agent applications start for `wdva gate` (Python 3.11 or newer).
mcp = [
    "mcp>=2.3,<3; python_version >= '3.11'",
    "pydantic>=2.12; python_version >= '3.11'",
]
# The document gate with everything it can use: the MCP server and PDF text extraction.
gate = ["wdva[mcp,pdf]"]
all = ["wdva[ml,pdf,langchain,mcp]"]
# Enough to run the test suite. ML tests are skipped unless `ml` is installed too.
# PyNaCl gives the vault tests a second, independent cipher implementation
# (libsodium) to check the format against; the package itself does not use it.
test = ["pytest>=8", "pytest-cov>=5", "pynacl>=1.5"]
dev = [
    "wdva[all,test]",
    "ruff>=0.17",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
wdva = "wdva.cli:main"

[project.urls]
Homepage = "https://github.com/zd87pl/private-ai-adapters"
Documentation = "https://github.com/zd87pl/private-ai-adapters/tree/main/docs"
Issues = "https://github.com/zd87pl/private-ai-adapters/issues"
Changelog = "https://github.com/zd87pl/private-ai-adapters/blob/main/CHANGELOG.md"

# The README links to other files in the repository with relative paths, which
# work on GitHub but lead nowhere on PyPI. The package description is the same
# README with those links pointed at the files of the release it describes.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Images first: a picture needs the address that serves the file itself, where
# the one for links shows GitHub's page about it. Once absolute, an image is
# left alone by the substitution for links that follows.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\])\((?!https?://|mailto:|#)([^)\s]+)\)'
replacement = '\1(https://raw.githubusercontent.com/zd87pl/private-ai-adapters/v$HFPR_VERSION/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|mailto:|#)([^)\s]+)\)'
replacement = '](https://github.com/zd87pl/private-ai-adapters/blob/v$HFPR_VERSION/\1)'

[tool.hatch.version]
path = "src/wdva/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wdva"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "ml: needs the ML stack (torch, transformers, peft); skipped when it is not installed",
    "mcp: needs the MCP SDK and Python 3.11 or newer; skipped otherwise",
    "anyio: async test, run by the anyio plugin that comes with the mcp extra",
]

[tool.coverage.run]
source = ["wdva"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Keep documentation code blocks as written; they are checked by the docs tests instead.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit
    "SIM",
    "C4",
    "PT",
    "RUF",
]
ignore = [
    "S101",   # assert is fine in tests and for internal invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]
"examples/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.10"
files = ["src/wdva"]
strict = true
warn_unused_ignores = true

# The optional ML stack is treated as untyped whether or not it is installed, so
# `mypy` gives the same answer in a bare environment and a full one.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "peft", "peft.*", "safetensors", "safetensors.*", "pypdf", "pypdf.*", "langchain_core", "langchain_core.*", "pydantic", "pydantic.*", "huggingface_hub", "huggingface_hub.*", "mcp", "mcp.*", "mcp_types", "mcp_types.*", "anyio", "anyio.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["Crypto.*"]
ignore_missing_imports = true
